name: ApiTest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Newman + HTML reporter
      run: npm install -g newman newman-reporter-html

    - name: Create results directory
      run: mkdir -p results

    - name: Run Projects API tests con reportes
      run: newman run Projects.postman_collection.json -r cli,html --reporter-html-export results/Projects.postman_collection.html

    - name: Run Items API tests con reportes
      run: newman run ItemsAPIMethods.postman_collection.json -r cli,html --reporter-html-export results/ItemsAPIMethods.postman_collection.html
  
    - name: Upload Newman reports
      uses: actions/upload-artifact@v4
      with:
        name: newman-reports
        path: results/
